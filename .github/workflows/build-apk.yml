
name: Generar APK de Mi Contador

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar Capacitor
        run: |
          mkdir -p android-app/www
          cp index.html manifest.webmanifest sw.js android-app/www/
          if [ -d icons ]; then cp -R icons android-app/www/; fi
          cd android-app
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.micontador.personal",
            "appName": "Mi Contador",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        run: |
          cd android-app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Descargar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Contador-APK
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention
          -days: 30
